<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel = 'stylesheet'
        href = "https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css"
    >
    <title>Quiz-Editor</title>
</head>
<body>

    <h1>Quiz-Editor</h1>

    <!-- Question input area -->
    <textarea 
        id = "question-editor" 
        placeholder = "Write your question here..."
    ></textarea>

    <!-- Container for live Preview -->
    <div id = 'preview'></div>

    <!-- Convert Markdown syntax into HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>

    <!-- Sanitize HTML before displaying it -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- Load the JavaScript application -->
    <script src = 'app.js'></script>

    <!-- Katex rendering engine -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"></script>

    <!-- Automatically identify LaTeX expression in HTML -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/contrib/auto-render.min.js"></script>
</body>
</html>
